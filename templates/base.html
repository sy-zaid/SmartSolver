<!-- <!DOCTYPE html> -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- <title>SmartSolver - Home</title> -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
      crossorigin="anonymous"
    />
    <!-- Stylesheet - 1 -->
    

    <!-- Stylesheet - Common Design Elements -->
    <link rel="stylesheet" href="/static/Stylesheets/common-style.css" />

    <!-- Scripting | Bootstrap -->
    {% load static %}
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
      crossorigin="anonymous"
    ></script>
    <script
      src="{% static '../static/Scripts/mathematics.js' %}"
      defer
    ></script>
    <!-- PLOTLY.JS SCRIPT -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  </head>

  <body>
    <!--Including the navbar-->
    <nav class="main-navbar">
      <a class="menu-icon" href="#">
        <img
          id="navbar-menu-icon"
          src="/static/Images/menu-icon.png"
          alt="menu"
        />
      </a>
      <div class="div-logo">
        <img id="logo" src="../static/Images/logo-smart-solver.png" alt="" />
      </div>
      <div class="menu-items">
        <a href="/pre-algebra">Mathematics</a>
        <a href="">Physics</a>
        <a href="#">Programming</a>
        <a href="#">Algorithms</a>
      </div>
      <div class="search-icon">
        <form class="d-flex" role="search">
          <input
            class="form-control me-2"
            type="search"
            placeholder="Search"
            aria-label="Search"
          />
          <button id="div-search-icon" type="submit">
            <img
              id="search-icon"
              src="../static/Images/search-icon.png"
              alt=""
            />
          </button>
        </form>
      </div>
    </nav>

    <div
      class="offcanvas offcanvas-start"
      data-bs-scroll="true"
      tabindex="-1"
      id="offcanvasWithBothOptions"
      aria-labelledby="offcanvasWithBothOptionsLabel"
    >
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasWithBothOptionsLabel">
          Choose your desired operation.
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body">
        <div class="row">
          <nav
            id="navbar-example3"
            class="h-100 flex-column align-items-stretch pe-4 border-end"
          >
            <nav class="nav nav-pills flex-column">
              <a class="button active" href="algebra" style="button"
                >1) Algebra</a
              >
              <nav class="nav nav-pills flex-column mx-5">
                <a class="button active" href="/algebra#polynomial_ops"
                  >1.1) Polynomial Calculations</a
                >
                <a class="nav-link active ms-3 my-1" href="#item-1-2"
                  >Item 1-2</a
                >
              </nav>
              <a class="nav-link" href="#item-2"></a>
              <a class="nav-link" href="#item-3">Item 3</a>
              <nav class="nav nav-pills flex-column">
                <a class="nav-link ms-3 my-1" href="#item-3-1">Item 3-1</a>
                <a class="nav-link ms-3 my-1" href="#item-3-2">Item 3-2</a>
              </nav>
            </nav>
          </nav>
        </div>
      </div>
    </div>

    {% block body %} {% endblock body%}
