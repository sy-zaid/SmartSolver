<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Algebra Calculator</title>
    <link rel="stylesheet" href="../Static/Stylesheets/pre-algebra.css">
</head>
<body>

    <div id="menu">
        <p>Mean</p>
        <p>Median</p>
        <p>Mode</p>
        <p>GCF</p>
        <p>LCM</p>
    </div>

    <div id="content">
        <h1>Pre-Algebra Calculator</h1>
        <h2>Mean, Median, Mode</h2>

        <!-- Input section -->
        <div class="input-section">
            <label for="input">Enter Input:</label>
            <input type="text" id="input" placeholder="Enter your input">
        </div>

        <!-- Output section -->
        <div class="output-section">
            <label for="output">Output:</label>
            <div id="output" class="output-box"></div>
        </div>

        <!-- Buttons -->
        <button id="solveButton">Solve</button>
        <button id="clearButton">Clear</button>
    </div>

</body>
</html>
